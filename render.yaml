services:
  - type: web
    name: arivayya-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        value: arivayya2026
      - key: OWNER_EMAIL
        value: arivayyaai@gmail.com
      - key: SITE_URL
        value: https://arivayya-ai.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: your-email@gmail.com
      - key: SMTP_PASS
        value: your-app-password
      - key: SMTP_FROM
        value: Arivayya AI <noreply@arivayyaai.com>
